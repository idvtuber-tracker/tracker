name: Archive Historical Streams

on:
  schedule:
    # Runs daily at 20:00 UTC (03:00 WIB) — well outside peak streaming hours
    - cron: '0 20 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI for testing or catch-up runs
    inputs:
      threshold_days:
        description: 'Archive streams older than N days (default: 25)'
        required: false
        default: '25'

concurrency:
  group: archiver
  cancel-in-progress: false  # never cancel a running archival — data safety first

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Clean up old archiver runs
        if: always()
        run: |
          HEADERS=(-H "Authorization: Bearer ${{ secrets.GH_PAT }}"
                   -H "Accept: application/vnd.github+json"
                   -H "X-GitHub-Api-Version: 2022-11-28")
          REPO="${{ github.repository }}"
          CURRENT="${{ github.run_id }}"

          # Fetch only completed runs of THIS workflow (archiver.yml)
          # so runs from deploy_dashboard.yml or tracker.yml are never touched.
          RUNS=$(curl -s "${HEADERS[@]}" \
            "https://api.github.com/repos/$REPO/actions/workflows/archiver.yml/runs?status=completed&per_page=100" \
            | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          # Skip all recent completed runs — keep active history
          for r in runs[1:]:
              print(r['id'])
          ")

          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" != "$CURRENT" ]; then
              curl -s -X DELETE "${HEADERS[@]}" \
                "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID"
              echo "Deleted run $RUN_ID"
            fi
          done
          echo "Cleanup complete."

      - name: Checkout tracker repo
        uses: actions/checkout@v4
        with:
          path: tracker

      - name: Download history.db from release
        env:
          GH_TOKEN: ${{ secrets.HISTORY_REPO_PAT }}
        run: |
          mkdir -p idvt-history
          if gh release download data \
              --repo "${{ github.repository_owner }}/idvt-history" \
              --pattern history.db \
              --dir idvt-history \
              --clobber 2>/dev/null; then
            echo "history.db downloaded from release ($(du -h idvt-history/history.db | cut -f1))."
          else
            echo "No history.db asset found yet — starting fresh."
          fi
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary

      - name: Run archiver
        working-directory: tracker
        env:
          AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
          HISTORY_DB_PATH: ${{ github.workspace }}/idvt-history/history.db
          ARCHIVE_THRESHOLD_DAYS: ${{ github.event.inputs.threshold_days || '25' }}
        run: |
          python archiver.py

      - name: Upload history.db to release
        env:
          GH_TOKEN: ${{ secrets.HISTORY_REPO_PAT }}
        working-directory: idvt-history
        run: |
          if [ ! -f history.db ]; then
            echo "history.db not found — nothing to upload."
            exit 0
          fi
          SIZE_MB=$(( $(stat -c%s history.db) / 1024 / 1024 ))
          echo "history.db is ${SIZE_MB} MB."
          if [ "$SIZE_MB" -gt 1800 ]; then
            echo "::warning::history.db is ${SIZE_MB} MB — approaching GitHub's 2GB release-asset limit. Consider archiving older data out or splitting the DB."
          fi
          gh release upload data history.db \
            --repo "${{ github.repository_owner }}/idvt-history" \
            --clobber
          echo "history.db uploaded to release 'data' (${SIZE_MB} MB)."
