name: YouTube Livestream Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: self-hosted

    env:
      YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_API_KEYS:     ${{ secrets.YOUTUBE_API_KEYS }}
      CHANNEL_IDS:          ${{ secrets.CHANNEL_IDS }}
      AIVEN_DATABASE_URL:   ${{ secrets.AIVEN_DATABASE_URL }}
      GH_PAT:               ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY:    ${{ github.repository }}
      DASHBOARD_REPO:       idvtuber-tracker/dashboard
      CSV_OUTPUT_PATH:      analytics.csv
      POLL_INTERVAL_SEC:    "900"
      DEPLOY_INTERVAL_SEC:  "900"
      STREAM_POLL_SEC:      "60"
      MAX_HISTORY_POINTS:   "60"
      PYTHONUTF8:           "1"
      PYTHONIOENCODING:     "utf-8"
      DISCORD_WEBHOOK:           ${{ secrets.DISCORD_WEBHOOK }}
      SLOW_CYCLE_THRESHOLD_SEC:  "60"

    steps:
      - name: Cancel queued duplicate runs
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          CURRENT="${{ github.run_id }}"
          HEADERS=(-H "Authorization: Bearer ${{ secrets.GH_PAT }}"
                   -H "Accept: application/vnd.github+json"
                   -H "X-GitHub-Api-Version: 2022-11-28")
          RUNS=$(curl -s "${HEADERS[@]}" \
            "https://api.github.com/repos/$REPO/actions/workflows/tracker.yml/runs?status=queued&per_page=100" \
            | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          for r in runs:
              print(r['id'])
          ")
          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" != "$CURRENT" ]; then
              curl -s -X POST "${HEADERS[@]}" \
                "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel"
              echo "Cancelled queued run $RUN_ID"
            fi
          done
          echo "Done cancelling duplicates."

      - name: Clean up old workflow runs
        if: always()
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          CURRENT="${{ github.run_id }}"
          HEADERS=(-H "Authorization: Bearer ${{ secrets.GH_PAT }}"
                   -H "Accept: application/vnd.github+json"
                   -H "X-GitHub-Api-Version: 2022-11-28")

          # Only completed runs are ever returned — the current in_progress
          # run can never appear here, so self-deletion is not possible.
          RUNS_JSON=$(curl -s "${HEADERS[@]}" \
            "https://api.github.com/repos/$REPO/actions/workflows/tracker.yml/runs?status=completed&per_page=100")

          echo "$RUNS_JSON" | python3 -c "
          import sys, json
          from datetime import datetime

          runs = json.load(sys.stdin).get('workflow_runs', [])
          current = '$CURRENT'
          deleted = 0
          for r in runs:
              if str(r['id']) == current:
                  continue
              if r.get('conclusion') != 'cancelled':
                  continue
              created = datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              updated = datetime.fromisoformat(r['updated_at'].replace('Z', '+00:00'))
              duration = (updated - created).total_seconds()
              # Only delete runs that hit the ~6h self-hosted runner wall
              # (5h50m+). Manual/duplicate cancels finish in seconds-minutes.
              if duration >= 21000:
                  print(r['id'])
          " > /tmp/runs_to_delete.txt

          DELETED=0
          while read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue
            curl -s -X DELETE "${HEADERS[@]}" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID"
            echo "Deleted 6h-wall run $RUN_ID"
            DELETED=$((DELETED + 1))
          done < /tmp/runs_to_delete.txt
          rm -f /tmp/runs_to_delete.txt
          echo "Cleanup complete. Deleted $DELETED run(s) that hit the 6-hour wall."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: idvtuber-tracker/tracker
          token: ${{ secrets.GH_PAT }}

      - name: Force git remote URL with PAT
        shell: bash
        run: |
          PAT="${{ secrets.GH_PAT }}"
          REPO="${{ github.repository }}"
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${REPO}.git"
          git config --global credential.helper store
          echo "https://x-access-token:${PAT}@github.com" > "$HOME/.git-credentials"
          echo "Remote URL and credentials set."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Run tracker
        id: run_tracker
        shell: bash
        run: python tracker.py

      - name: Restart workflow
        id: restart
        if: always()
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/tracker.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "New workflow run triggered."

      - name: Notify Discord — tracker error
        if: always() && steps.run_tracker.outcome == 'failure'
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"@here\",
              \"embeds\": [{
                \"title\": \"[ERROR] Tracker crashed - exit code 1\",
                \"description\": \"tracker.py exited with a non-zero code. The 6-hour cycle was interrupted and data collection has stopped until the workflow restarts.\",
                \"color\": 15548997,
                \"fields\": [
                  { \"name\": \"Run\", \"value\": \"[${RUN_ID}](${RUN_URL})\", \"inline\": true },
                  { \"name\": \"Repository\", \"value\": \"${REPO}\", \"inline\": true }
                ],
                \"footer\": { \"text\": \"IDVTuber Tracker\" }
              }]
            }"
          echo "Discord error notification sent."

      - name: Notify Discord — cycle complete, restarting
        if: always() && (steps.run_tracker.outcome == 'cancelled' || steps.run_tracker.outcome == 'success') && steps.restart.outcome == 'success'
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"@here\",
              \"embeds\": [{
                \"title\": \"[OK] 6-hour cycle complete - new cycle started\",
                \"description\": \"tracker.py completed its 6-hour run successfully. A new workflow cycle has been dispatched and data collection continues.\",
                \"color\": 5763719,
                \"fields\": [
                  { \"name\": \"Completed run\", \"value\": \"[${RUN_ID}](${RUN_URL})\", \"inline\": true },
                  { \"name\": \"Timestamp\", \"value\": \"${TIMESTAMP}\", \"inline\": true }
                ],
                \"footer\": { \"text\": \"IDVTuber Tracker\" }
              }]
            }"
          echo "Discord restart notification sent."
